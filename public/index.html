<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>MOJON | AI Workout Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── SCREEN 1: SETUP ─────────────────────────────────────────── -->
  <div id="screen-setup" class="screen">

    <!-- Init loading overlay (visible during camera + model load) -->
    <div id="setup-loading" class="setup-loading">
      <p id="setup-message">Initializing…</p>
    </div>

    <div class="setup-page">
      <header class="setup-header">
        <img src="logo.png" class="logo" alt="MOJON Logo" />
        <div class="header-text">
          <p class="tagline">MOJON IS HERE TO BUILD THE NEXT YOU</p>
          <p class="credits">by Luca Spinelli</p>
        </div>
        <div class="header-utils">
          <button type="button" id="bodyScanBtn" class="util-btn">🧍 Scan</button>
          <button type="button" id="historyBtn" class="util-btn">📋 History</button>
          <a href="competition.html" class="util-btn" style="text-decoration:none;">🚣 ERGs</a>
        </div>
      </header>

      <form id="builder">

        <!-- Step 1: Modality -->
        <div class="setup-section">
          <h3>Pick your style</h3>
          <div class="modality-grid">
            <button type="button" class="modality-card" data-modality="emom">
              <span class="modality-icon">⏰</span>
              <span class="modality-text">
                <span class="modality-name">EMOM</span>
                <span class="modality-sub">Every Minute On the Minute</span>
              </span>
            </button>
            <button type="button" class="modality-card" data-modality="amrap">
              <span class="modality-icon">🔥</span>
              <span class="modality-text">
                <span class="modality-name">AMRAP</span>
                <span class="modality-sub">As Many Rounds As Possible</span>
              </span>
            </button>
            <button type="button" class="modality-card" data-modality="fortime">
              <span class="modality-icon">⚡</span>
              <span class="modality-text">
                <span class="modality-name">FOR TIME</span>
                <span class="modality-sub">Finish all rounds, fastest wins</span>
              </span>
            </button>
          </div>
        </div>

        <!-- Step 2: Exercises (revealed after modality selected) -->
        <div class="setup-section hidden" id="exercise-section">
          <h3>Build your circuit</h3>
          <div id="movement-list" class="movement-grid"></div>
        </div>

        <!-- Step 3: Config + Start (revealed after modality selected) -->
        <div class="setup-footer hidden" id="setup-footer">
          <div class="setup-controls">
            <label class="rounds-label">
              <span id="rounds-label-text">Rounds</span>
              <input type="number" id="rounds" min="1" value="3" />
            </label>
            <button type="submit" id="start" class="btn-start">▶ Start Workout</button>
          </div>
        </div>

      </form>
    </div>
  </div>

  <!-- ── SCREEN 2: ACTIVE WORKOUT (CAMERA) ──────────────────────── -->
  <div id="screen-workout" class="screen hidden">

    <!-- Compact top bar -->
    <div class="workout-topbar">
      <p id="active-movement">—</p>
      <div class="topbar-right">
        <span id="active-round">Round 0 / 0</span>
        <span id="active-reps">Reps: 0 / 0</span>
      </div>
    </div>

    <!-- Camera fills the middle -->
    <div class="camera-area">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div id="cue-display" class="cue-display hidden"></div>

      <!-- Workout prescription panel (always-visible sidebar over video) -->
      <div id="workout-panel" class="workout-panel hidden">
        <div class="wp-header">
          <span id="wp-modality">AMRAP</span>
          <span id="wp-config">20 min</span>
        </div>
        <ol id="wp-movements" class="wp-movements"></ol>
      </div>
    </div>

    <!-- Compact bottom bar -->
    <div class="workout-bottombar">
      <p id="timer-display" class="timer">00:00</p>
      <div id="round-stats" class="round-stats"></div>
      <button type="button" id="stop" class="btn-stop">■ Stop</button>
    </div>

  </div>

  <!-- ── SCREEN 3: BODY SCAN ───────────────────────────────────── -->
  <div id="screen-scan" class="screen hidden">
    <div id="scan-host"></div>
  </div>

  <!-- ── SCREEN 4: POST-WORKOUT STATS ──────────────────────────── -->
  <div id="screen-stats" class="screen hidden">
    <div class="stats-page">

      <div class="stats-hero">
        <div class="stats-check">✓</div>
        <p id="stats-modality-badge" class="stats-modality-badge">20 min AMRAP</p>
      </div>

      <div class="stats-metrics-grid">
        <div class="stats-metric-card">
          <span id="stats-primary-value" class="stats-metric-value">4</span>
          <span id="stats-primary-label" class="stats-metric-label">Rounds</span>
        </div>
        <div class="stats-metric-card">
          <span id="stats-secondary-value" class="stats-metric-value">18:42</span>
          <span id="stats-secondary-label" class="stats-metric-label">Time</span>
        </div>
      </div>

      <div class="stats-section">
        <h4 class="stats-section-title">Circuit</h4>
        <ol id="stats-circuit" class="stats-circuit"></ol>
      </div>

      <div class="stats-section hidden" id="stats-rounds-section">
        <h4 class="stats-section-title">Round Breakdown</h4>
        <div id="stats-rounds-list" class="stats-rounds-list"></div>
      </div>

      <div class="stats-actions">
        <button id="statsAgainBtn" class="btn-again">↩ Do it again</button>
        <button id="statsHomeBtn" class="btn-stats-home">← Back to Setup</button>
      </div>

    </div>
  </div>

  <!-- ── HISTORY OVERLAY (global) ───────────────────────────────── -->
  <div id="history-panel" class="history-panel hidden">
    <div class="history-panel-inner">
      <div class="history-panel-header">
        <h3>📋 Workout History</h3>
        <button id="closeHistory" class="close-btn">✕</button>
      </div>
      <div id="history-content" class="history-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script type="module" src="script.js"></script>

</body>
</html>
