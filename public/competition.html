<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOJON COMP ERGS — Live Dashboard</title>
  <style>
    :root {
      --bg:       #09090f;
      --panel:    #111118;
      --border:   #1e1e2e;
      --accent:   #00e5ff;
      --gold:     #ffd700;
      --silver:   #c0c0c0;
      --bronze:   #cd7f32;
      --text:     #f0f0f0;
      --muted:    #4a4a6a;
      --green:    #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    #header {
      height: 64px;
      background: linear-gradient(135deg, #0d0d1c 0%, #131325 100%);
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 24px rgba(0,229,255,0.45);
      text-transform: uppercase;
    }
    .logo span { color: #fff; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .target-label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .target-label strong {
      display: block;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 1px;
    }

    #race-timer {
      font-size: 2.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      color: #fff;
      min-width: 110px;
      text-align: right;
    }

    #race-badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 5px 14px;
      border-radius: 4px;
      border: 1.5px solid currentColor;
      text-transform: uppercase;
    }
    .badge-idle     { color: var(--muted); }
    .badge-running  { color: var(--green); animation: blink 1.4s ease-in-out infinite; }
    .badge-paused   { color: #ff9800; }
    .badge-finished { color: var(--gold); }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.45} }

    /* ── Main ────────────────────────────────────────────────────────────── */
    #main {
      height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      padding: 8px 14px 8px;
      gap: 5px;
      overflow: hidden;
    }

    /* Column header row */
    #col-headers {
      display: grid;
      grid-template-columns: 68px 1fr 200px 2fr 100px 96px 76px 72px;
      gap: 8px;
      padding: 0 12px 2px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Participant row ──────────────────────────────────────────────────── */
    .p-row {
      flex: 1;
      min-height: 0;
      background: var(--panel);
      border-radius: 8px;
      border-left: 4px solid var(--border);
      display: grid;
      grid-template-columns: 68px 1fr 200px 2fr 100px 96px 76px 72px;
      gap: 8px;
      align-items: center;
      padding: 0 12px;
      transition: border-color 0.4s ease, background 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    /* Rank glow strip behind each row */
    .p-row::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 35%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .p-row.rank-1 {
      border-left-color: var(--gold);
    }
    .p-row.rank-1::before {
      background: linear-gradient(90deg, rgba(255,215,0,.12) 0%, transparent 100%);
      opacity: 1;
    }
    .p-row.rank-2 {
      border-left-color: var(--silver);
    }
    .p-row.rank-2::before {
      background: linear-gradient(90deg, rgba(192,192,192,.09) 0%, transparent 100%);
      opacity: 1;
    }
    .p-row.rank-3 {
      border-left-color: var(--bronze);
    }
    .p-row.rank-3::before {
      background: linear-gradient(90deg, rgba(205,127,50,.09) 0%, transparent 100%);
      opacity: 1;
    }
    .p-row.finished {
      border-left-color: var(--gold);
      opacity: 0.85;
    }

    /* Rank number */
    .rank-num {
      font-size: clamp(1.1rem, 2.4vh, 1.7rem);
      font-weight: 900;
      text-align: center;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }
    .rank-1 .rank-num { color: var(--gold); }
    .rank-2 .rank-num { color: var(--silver); }
    .rank-3 .rank-num { color: var(--bronze); }

    /* Finish badge */
    .finish-badge {
      font-size: 0.55rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--gold);
      display: block;
      text-align: center;
    }

    /* Name */
    .p-name {
      font-size: clamp(0.85rem, 2vh, 1.25rem);
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* Distance label next to bar */
    .dist-label {
      font-size: clamp(0.8rem, 1.8vh, 1.1rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
      padding-right: 6px;
      position: relative;
      z-index: 1;
    }
    .dist-label .unit {
      font-size: 0.65em;
      font-weight: 400;
      color: var(--muted);
      margin-left: 2px;
    }

    /* Progress bar */
    .prog-wrap {
      background: #18182a;
      border-radius: 5px;
      height: clamp(10px, 1.6vh, 18px);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .prog-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.4s ease-out;
      background: linear-gradient(90deg, #0066aa, var(--accent));
      position: relative;
    }
    .prog-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 12px;
      background: rgba(255,255,255,0.35);
      border-radius: 0 5px 5px 0;
    }
    .rank-1 .prog-fill { background: linear-gradient(90deg, #b8860b, var(--gold)); }
    .rank-2 .prog-fill { background: linear-gradient(90deg, #777, var(--silver)); }
    .rank-3 .prog-fill { background: linear-gradient(90deg, #7b4a00, var(--bronze)); }

    /* Metric cell */
    .metric {
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .metric-val {
      font-size: clamp(0.85rem, 1.9vh, 1.2rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }
    .metric-lbl {
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Waiting screen ───────────────────────────────────────────────────── */
    #waiting {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
    }
    #waiting .big { font-size: 1.4rem; letter-spacing: 4px; font-weight: 700; text-transform: uppercase; }
    #waiting .sub { font-size: 0.8rem; letter-spacing: 2px; }

    /* ── Finish flash overlay ─────────────────────────────────────────────── */
    #finish-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #finish-flash.show { opacity: 1; }
    .finish-msg {
      background: rgba(0,0,0,0.75);
      border: 3px solid var(--gold);
      border-radius: 12px;
      padding: 24px 48px;
      text-align: center;
    }
    .finish-msg .label { font-size: 0.8rem; letter-spacing: 3px; color: var(--gold); }
    .finish-msg .name  { font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; margin-top: 4px; }
    .finish-msg .time  { font-size: 1.2rem; color: var(--accent); margin-top: 4px; }

    /* connection dot */
    #conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #444;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }
    #conn-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  </style>
</head>
<body>

<div id="header">
  <div style="display:flex;align-items:center;gap:20px;">
    <a href="index.html" style="font-size:.75rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-decoration:none;text-transform:uppercase;border:1px solid var(--border);padding:5px 12px;border-radius:5px;">← MOJON</a>
    <div class="logo">MOJON<span> COMP</span> ERGS</div>
  </div>
  <div class="header-right">
    <div class="target-label">
      Target<strong id="target-val">2000 m</strong>
    </div>
    <div id="race-timer">00:00</div>
    <div id="race-badge" class="badge-idle">IDLE</div>
    <div style="font-size:0.65rem;color:var(--muted)">
      <span id="conn-dot"></span><span id="conn-label">connecting</span>
    </div>
  </div>
</div>

<div id="main">
  <div id="col-headers" style="display:none">
    <div></div>
    <div>Athlete</div>
    <div style="text-align:right">Distance</div>
    <div style="padding-left:8px">Progress</div>
    <div>Pace /500m</div>
    <div>Watts</div>
    <div>SPM</div>
    <div>Time</div>
  </div>
  <div id="rows" style="display:contents"></div>
  <div id="waiting">
    <div class="big">Waiting for race to start</div>
    <div class="sub">Open <strong>localhost:3000/admin.html</strong> to configure</div>
  </div>
</div>

<div id="finish-flash">
  <div class="finish-msg">
    <div class="label">FINISHED</div>
    <div class="name" id="flash-name">—</div>
    <div class="time" id="flash-time">—</div>
  </div>
</div>

<script>
  // ── Helpers ────────────────────────────────────────────────────────────────

  function fmtTime(secs) {
    if (!secs || secs < 0) return '00:00';
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function fmtPace(paceSec) {
    if (!paceSec || paceSec <= 0 || paceSec > 900) return '--:--';
    const m = Math.floor(paceSec / 60);
    const s = Math.floor(paceSec % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function fmtDist(m) {
    if (!m || m <= 0) return '0';
    return Math.round(m).toLocaleString();
  }

  // ── Timer ──────────────────────────────────────────────────────────────────

  let _timerRAF = null;
  let _raceStartTime = null;
  let _raceStatus = 'idle';

  function tickTimer() {
    if (_raceStatus === 'running' && _raceStartTime) {
      const elapsed = (Date.now() - _raceStartTime) / 1000;
      document.getElementById('race-timer').textContent = fmtTime(elapsed);
    }
    _timerRAF = requestAnimationFrame(tickTimer);
  }
  tickTimer();

  // ── Finish flash ───────────────────────────────────────────────────────────

  let _flashTimeout = null;

  function showFinishFlash(name, finishTimeMs) {
    const el = document.getElementById('finish-flash');
    document.getElementById('flash-name').textContent = name.toUpperCase();
    if (_raceStartTime && finishTimeMs) {
      const elapsed = (finishTimeMs - _raceStartTime) / 1000;
      document.getElementById('flash-time').textContent = fmtTime(elapsed);
    }
    el.classList.add('show');
    clearTimeout(_flashTimeout);
    _flashTimeout = setTimeout(() => el.classList.remove('show'), 4000);
  }

  // ── Render ─────────────────────────────────────────────────────────────────

  let _lastParticipantIds = '';

  function render(s) {
    _raceStatus    = s.raceStatus;
    _raceStartTime = s.raceStartTime;

    // Header
    document.getElementById('target-val').textContent = `${s.targetDistance} m`;

    if (s.raceStatus !== 'running') {
      document.getElementById('race-timer').textContent =
        s.raceStartTime ? fmtTime((Date.now() - s.raceStartTime) / 1000) : '00:00';
    }

    const badge = document.getElementById('race-badge');
    badge.className = `badge-${s.raceStatus}`;
    badge.textContent = s.raceStatus.toUpperCase();

    const ps = s.participants || [];

    const waitEl = document.getElementById('waiting');
    const hdrEl  = document.getElementById('col-headers');

    if (ps.length === 0) {
      waitEl.style.display = 'flex';
      hdrEl.style.display  = 'none';
      document.getElementById('rows').innerHTML = '';
      return;
    }

    waitEl.style.display = 'none';
    hdrEl.style.display  = 'grid';

    // Check if participant list changed (avoid full re-render on every tick)
    const idKey = ps.map(p => p.id).join(',');
    const rowsEl = document.getElementById('rows');

    if (idKey !== _lastParticipantIds) {
      // Full rebuild
      _lastParticipantIds = idKey;
      rowsEl.innerHTML = ps.map(p => rowHTML(p, s.targetDistance)).join('');
    } else {
      // Partial update — just update values in existing rows
      ps.forEach(p => updateRow(p, s.targetDistance));
    }
  }

  function rowHTML(p, target) {
    const progress = Math.min(100, ((p.distance || 0) / target) * 100).toFixed(2);
    const rankClass = p.rank <= 3 ? `rank-${p.rank}` : '';
    const finishCls = p.finished ? 'finished' : '';

    return `<div class="p-row ${rankClass} ${finishCls}" data-id="${p.id}">
      <div class="rank-num">
        ${p.rank}
        ${p.finished ? '<span class="finish-badge">FINISHED</span>' : ''}
      </div>
      <div class="p-name">${escHtml(p.name)}</div>
      <div class="dist-label">
        ${fmtDist(p.distance)}<span class="unit">m</span>
      </div>
      <div class="prog-wrap">
        <div class="prog-fill" style="width:${progress}%"></div>
      </div>
      <div class="metric">
        <div class="metric-val">${fmtPace(p.pace)}</div>
        <div class="metric-lbl">/500m</div>
      </div>
      <div class="metric">
        <div class="metric-val">${p.watts > 0 ? p.watts : '--'}</div>
        <div class="metric-lbl">watts</div>
      </div>
      <div class="metric">
        <div class="metric-val">${p.spm > 0 ? p.spm : '--'}</div>
        <div class="metric-lbl">spm</div>
      </div>
      <div class="metric">
        <div class="metric-val">${fmtTime(p.elapsedTime || 0)}</div>
        <div class="metric-lbl">time</div>
      </div>
    </div>`;
  }

  function updateRow(p, target) {
    const row = document.querySelector(`.p-row[data-id="${p.id}"]`);
    if (!row) return;

    const progress = Math.min(100, ((p.distance || 0) / target) * 100).toFixed(2);

    // Update rank class
    row.className = `p-row ${p.rank <= 3 ? 'rank-'+p.rank : ''} ${p.finished ? 'finished' : ''}`;

    const cells = row.children;
    // [0]=rank, [1]=name, [2]=dist-label, [3]=prog-wrap, [4]=pace, [5]=watts, [6]=spm, [7]=time
    cells[0].innerHTML = `${p.rank}${p.finished ? '<span class="finish-badge">FINISHED</span>' : ''}`;
    cells[2].innerHTML = `${fmtDist(p.distance)}<span class="unit">m</span>`;
    cells[3].querySelector('.prog-fill').style.width = `${progress}%`;
    cells[4].querySelector('.metric-val').textContent = fmtPace(p.pace);
    cells[5].querySelector('.metric-val').textContent = p.watts > 0 ? p.watts : '--';
    cells[6].querySelector('.metric-val').textContent = p.spm > 0 ? p.spm : '--';
    cells[7].querySelector('.metric-val').textContent = fmtTime(p.elapsedTime || 0);
  }

  function escHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────

  let _reconnectDelay = 1000;

  function connect() {
    const ws = new WebSocket(`ws://${location.host}`);
    const dot   = document.getElementById('conn-dot');
    const label = document.getElementById('conn-label');

    ws.onopen = () => {
      dot.className = 'connected';
      label.textContent = 'live';
      _reconnectDelay = 1000;
    };

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        render(msg.data);
      } else if (msg.type === 'finish') {
        showFinishFlash(msg.name, msg.finishTime);
      }
    };

    ws.onclose = () => {
      dot.className = '';
      label.textContent = 'reconnecting…';
      setTimeout(connect, _reconnectDelay);
      _reconnectDelay = Math.min(_reconnectDelay * 2, 10000);
    };
  }

  connect();
</script>
</body>
</html>
